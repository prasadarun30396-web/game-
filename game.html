<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Train Runner</title>
<style>
  body { margin: 0; background: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
  canvas { background: #222; border: 3px solid #ff9f1c; border-radius: 10px; }
  #btn { margin-top: 15px; padding: 15px 40px; font-size: 22px; font-weight: bold; background: #ff5400; color: white; border: none; border-radius: 30px; cursor: pointer; }
</style>
</head>
<body>

<canvas id="c" width="700" height="450"></canvas>
<button id="btn">START GAME</button>

<script>
var c = document.getElementById("c");
var ctx = c.getContext("2d");
var btn = document.getElementById("btn");

var playing = false;
var lane = 1; // 0=Left, 1=Mid, 2=Right
var jump = 0;
var dy = 0;
var score = 0;
var trains = new Array();
var coins = new Array();
var frame = 0;
var audio = null;

function beep(f, d, t) {
  if (!audio) return;
  var o = audio.createOscillator();
  var g = audio.createGain();
  o.type = t;
  o.frequency.value = f;
  g.gain.value = 0.15;
  o.connect(g);
  g.connect(audio.destination);
  o.start();
  o.stop(audio.currentTime + d);
}

btn.onclick = function() {
  if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
  if (audio.state === "suspended") audio.resume();
  playing = true;
  lane = 1;
  jump = 0;
  dy = 0;
  score = 0;
  trains = new Array();
  coins = new Array();
  frame = 0;
  btn.style.display = "none";
  beep(300, 0.2, "sawtooth");
  loop();
};

document.onkeydown = function(e) {
  if (!playing) return;
  if (e.key === "ArrowLeft" && lane > 0) { lane--; beep(250, 0.08, "sine"); }
  if (e.key === "ArrowRight" && lane < 2) { lane++; beep(250, 0.08, "sine"); }
  if ((e.key === "ArrowUp" || e.key === " ") && jump === 0) { dy = 14; beep(450, 0.15, "triangle"); }
};

function loop() {
  if (!playing) return;
  ctx.clearRect(0, 0, 700, 450);

  // Sky & Ground
  ctx.fillStyle = "#1d3557";
  ctx.fillRect(0, 0, 700, 140);
  ctx.fillStyle = "#2b2d42";
  ctx.fillRect(0, 140, 700, 310);

  // 3 Tracks
  for (var i = 0; i < 3; i++) {
    var topX = 290 + i * 60;
    var botX = 150 + i * 200;
    ctx.strokeStyle = "#aaa";
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(topX - 15, 140); ctx.lineTo(botX - 45, 450); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(topX + 15, 140); ctx.lineTo(botX + 45, 450); ctx.stroke();
  }

  frame++;
  score++;
  if (frame % 70 === 0) {
    var l = Math.floor(Math.random() * 3);
    trains.push({ lane: l, z: 0, horn: false });
    var cl = (l + 1) % 3;
    coins.push({ lane: cl, z: 0 });
  }

  // Trains
  for (var i = trains.length - 1; i >= 0; i--) {
    var t = trains.at(i);
    t.z += 0.014;
    if (t.z > 0.3 && !t.horn) { t.horn = true; beep(180, 0.4, "sawtooth"); }
    var tx = (290 + t.lane * 60) * (1 - t.z) + (150 + t.lane * 200) * t.z;
    var ty = 140 + t.z * 310;
    var w = 30 + t.z * 80;
    var h = 35 + t.z * 95;
    ctx.fillStyle = "#d62828";
    ctx.fillRect(tx - w / 2, ty - h, w, h);
    ctx.fillStyle = "#ffb703";
    ctx.fillRect(tx - w / 2, ty - h * 0.4, w, h * 0.15);

    if (t.z > 0.85 && t.z < 0.98 && t.lane === lane && jump < 50) {
      playing = false;
      beep(90, 0.5, "sawtooth");
      btn.innerText = "GAME OVER! Score: " + score + " - PLAY AGAIN";
      btn.style.display = "inline-block";
      return;
    }
    if (t.z > 1.1) trains.splice(i, 1);
  }

  // Coins
  for (var i = coins.length - 1; i >= 0; i--) {
    var cn = coins.at(i);
    cn.z += 0.014;
    var cx = (290 + cn.lane * 60) * (1 - cn.z) + (150 + cn.lane * 200) * cn.z;
    var cy = 140 + cn.z * 310;
    ctx.fillStyle = "#ffd166";
    ctx.beginPath(); ctx.arc(cx, cy - 15 * cn.z, 6 + cn.z * 14, 0, Math.PI * 2); ctx.fill();

    if (cn.z > 0.85 && cn.z < 0.98 && cn.lane === lane) {
      score += 50;
      beep(1100, 0.1, "sine");
      coins.splice(i, 1);
    } else if (cn.z > 1.1) coins.splice(i, 1);
  }

  // Jump Physics & Player
  if (dy !== 0 || jump > 0) {
    jump += dy;
    dy -= 1;
    if (jump <= 0) { jump = 0; dy = 0; }
  }
  var px = 150 + lane * 200;
  var py = 420 - jump;
  ctx.fillStyle = "#06d6a0";
  ctx.fillRect(px - 20, py - 60, 40, 60);

  // Score Text
  ctx.fillStyle = "#fff";
  ctx.font = "bold 22px sans-serif";
  ctx.fillText("Score: " + score, 20, 35);

  requestAnimationFrame(loop);
}
</script>
</body>
</html>
